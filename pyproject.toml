[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yagua"
version = "0.1.0"
description = "Tool for collecting and managing test information from pytest-based projects"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["testing", "pytest", "qa", "test-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "peewee>=3.17.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "tox>=4.0.0",
    "mutmut>=2.4.0",
    "cosmic-ray>=8.3.0",
]

[project.scripts]
yagua = "yagua.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/yagua"
Documentation = "https://github.com/yourusername/yagua#readme"
Repository = "https://github.com/yourusername/yagua"
Issues = "https://github.com/yourusername/yagua/issues"

[tool.setuptools]
packages = ["yagua"]

